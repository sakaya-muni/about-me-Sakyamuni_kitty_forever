<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨🎀💕Welcome to ศากยมุนี 💕🎀✨</title>
    <!-- นำเข้า Font น่ารักๆ และ Icon สำหรับ Social Media -->
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Mitr', sans-serif;
        }

        body {
            background-color: #1a1a1a; /* พื้นหลังสีดำเข้ม */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* ----- โซนรูปคิตตี้บนพื้นหลัง (Background Kitties) ----- */
        .bg-kitty {
            position: absolute;
            width: 350px; /* ปรับขนาดน้องคิตตี้บนพื้นหลังตามใจชอบ */
            height: auto;
            opacity: 0.25; /* ความโปร่งแสง 0.25 (ปรับเพิ่ม-ลดได้ตั้งแต่ 0 ถึง 1) */
            z-index: 1;
            pointer-events: none; /* ทำให้กดทะลุได้ ไม่บังปุ่ม */
        }

        /* ตัวที่ 1: ซ้ายบน */
        .kitty-top-left {
            top: 10%;
            left: 8%;
            animation: float-1 4s ease-in-out infinite;
        }

        /* ตัวที่ 2: ขวาบน */
        .kitty-top-right {
            top: 15%;
            right: 8%;
            animation: float-2 5s ease-in-out infinite;
        }

        /* ตัวที่ 3: ซ้ายล่าง */
        .kitty-bottom-left {
            bottom: 12%;
            left: 10%;
            animation: float-2 4.5s ease-in-out infinite;
        }

        /* ตัวที่ 4: ขวาล่าง */
        .kitty-bottom-right {
            bottom: 10%;
            right: 10%;
            animation: float-1 3.8s ease-in-out infinite;
        }

        /* แอนิเมชันดุ๊กดิ๊กของพื้นหลัง */
        @keyframes float-1 {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(5deg); }
        }

        @keyframes float-2 {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(-8deg); }
        }

        /* สำหรับหน้าจอโทรศัพท์ ให้ซ่อนคิตตี้พื้นหลังบางตัวเพื่อไม่ให้รกเกินไป */
        @media (max-width: 600px) {
            .kitty-top-left, .kitty-bottom-right {
                display: none;
            }
            .bg-kitty {
                width: 65px;
                opacity: 0.2;
            }
        }

        /* ----- กล่องเนื้อหาตรงกลาง ----- */
        .container {
            background: rgba(255, 182, 193, 0.12); /* พื้นหลังกล่องสีชมพูอ่อนโปร่งแสง */
            backdrop-filter: blur(12px);
            border: 2px solid #ffb6c1; 
            border-radius: 25px;
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(255, 182, 193, 0.2);
            position: relative;
            z-index: 10; /* ให้กล่องอยู่เลเยอร์บนสุด */
        }

        /* รูปคิตตี้หลักตรงกลาง */
        .kitty-main-img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin-bottom: 15px;    
            filter: drop-shadow(0px 4px 8px rgba(255, 182, 193, 0.5));
            animation: bounce 3s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: #ffb6c1; 
            font-size: 24px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.6);
        }

        p.bio {
            color: #cccccc;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* โซนปุ่มติดต่อ (Social Links) */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 14px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1.5px solid transparent;
        }

        /* สไตล์ปุ่มแต่ละช่องทาง (คุมโทน ดำ-ชมพู) */
        .facebook {
            background-color: #0b0b0b;
            color: #ffb6c1;
            border-color: #ffb6c1;
        }

        .instagram {
            background-color: #ffb6c1;
            color: #1a1a1a;
        }

        .tiktok {
            background-color: #0b0b0b;
            color: #ffb6c1;
            border-color: #ffb6c1;
        }

        .youtube {
            background-color: #ffb6c1;
            color: #1a1a1a;
        }

        /* เอฟเฟกต์ตอน Hover */
        .social-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.6);
        }
        
        .facebook:hover, .tiktok:hover {
            background-color: #ffb6c1;
            color: #1a1a1a;
        }

        .instagram:hover, .youtube:hover {
            background-color: #1a1a1a;
            color: #ffb6c1;
            border-color: #ffb6c1;
        }

        .footer-icon {
            margin-top: 25px;
            color: #ffb6c1;
            font-size: 18px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <!-- รูปคิตตี้ 4 ตัวบนพื้นหลัง (เรียกจากไฟล์ในเครื่องของคุณ) -->
    <img src="bg-kitty1.png" class="bg-kitty kitty-top-left" alt="kitty-bg">
    <img src="bg-kitty2.png" class="bg-kitty kitty-top-right" alt="kitty-bg">
    <img src="bg-kitty3.png" class="bg-kitty kitty-bottom-left" alt="kitty-bg">
    <img src="bg-kitty4.png" class="bg-kitty kitty-bottom-right" alt="kitty-bg">

    <!-- กล่องหลักตรงกลาง -->
    <div class="container">
        <!-- รูปคิตตี้หลักตรงกลาง (เรียกจากไฟล์ในเครื่องของคุณ) -->
        <img src="kitty-main.png" alt="Hello Kitty Main" class="kitty-main-img">
        
        <h1>About me ศากยมุนี</h1>
        <p class="bio">🎀💕ยินดีต้อนรับน้า อยากรู้อะไรจิ้มเลย 💕🎀</p>

        <!-- ช่องทางติดต่อทั้ง 4 อย่าง -->
        <div class="links-container">
            
            <a href="https://www.facebook.com/lnwjelect/" target="_blank" class="social-btn facebook">
                <i class="fab fa-facebook-f"></i> Facebook
            </a>

            <a href="https://www.instagram.com/is_about_me_555/" target="_blank" class="social-btn instagram">
                <i class="fab fa-instagram"></i> Instagram
            </a>

            <a href="https://www.tiktok.com/@buddhaxi_jaolecute?lang=th-TH" target="_blank" class="social-btn tiktok">
                <i class="fab fa-tiktok"></i> TikTok
            </a>

            <a href="https://www.youtube.com/@Buddha_jelecute" target="_blank" class="social-btn youtube">
                <i class="fab fa-youtube"></i> YouTube
            </a>
            
        </div>

        <div class="footer-icon">
            <i class="fa-solid fa-ribbon"></i> 💕 <i class="fa-solid fa-ribbon"></i>
        </div>
    </div>

</body>
</html>
